<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Passwords — BrAIn</title>
<script>
  // Served via LoadRawString — flags itself so the host maps the tab to
  // about:passwords instead of the literal about:blank that location.href reports.
  window.__brainPw = 1;
  // Snapshot baked in by the host; live updates arrive as b:25 pushes that
  // chrome.js forwards to us via the 'brain-msg' document event.
  window.__brainPwData = __BRAIN_PW_JSON__;
</script>
<style>
/*@THEME*/
  body { padding: 84px 24px 90px; }
  .wrap { max-width: 880px; }
  .head { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  .logo { font-size: 30px; flex: none; }
  .cnt { flex: none; color: var(--dim); font-size: 12px; font-weight: 600; }
  #q {
    flex: 1; min-width: 0; height: 46px; padding: 0 18px; border-radius: 14px; outline: none;
    background: var(--glass); border: 1px solid rgba(255,255,255,.09);
    color: #f0f0fc; font: 14px var(--font); transition: border-color .15s, box-shadow .2s, background .15s;
  }
  #q:focus { background: var(--glass-hi); border-color: hsl(var(--h) 100% 74% / .55); box-shadow: 0 0 0 4px hsl(var(--h) 100% 74% / .13); }
  #q::placeholder { color: #5f5f7c; }

  .row {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px;
    position: relative; transition: background .12s;
  }
  .row:hover { background: rgba(255,255,255,.055); }
  .ic {
    width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #fff; position: relative; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
  }
  .ic svg { width: 16px; height: 16px; }
  .tt { color: #efeffd; font-size: 13.5px; font-weight: 600; max-width: 26%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; }
  .uu { color: #74749a; font-size: 12.5px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pw { color: #9a9ab8; font: 12.5px var(--mono); flex: none; min-width: 120px; letter-spacing: 1px; }
  .pw.on { color: #e8e8fc; letter-spacing: 0; }
  .tm { color: var(--dim); font-size: 11.5px; flex: none; min-width: 62px; text-align: right; }

  .act { display: flex; gap: 4px; flex: none; opacity: 0; transition: opacity .12s; }
  .row:hover .act { opacity: 1; }
  .row.pd { opacity: .45; pointer-events: none; }
  .ab {
    width: 26px; height: 26px; border: 0; border-radius: 8px; display: grid; place-items: center;
    background: transparent; color: var(--dim); cursor: pointer; transition: background .12s, color .12s;
  }
  .ab:hover { background: rgba(255,255,255,.1); color: #d8d8f0; }
  .ab svg { width: 14px; height: 14px; }
  .ab.del:hover { background: rgba(232,17,35,.18); color: #ffb4b9; }
  .ab.ok { color: #6fd8a8; }

  .empty { padding: 72px 0; text-align: center; color: #50506a; font-size: 14px; line-height: 1.8; }
  .empty b { color: #7a7a9c; font-weight: 600; }
  .foot { margin-top: 48px; text-align: center; color: #50506a; font-size: 12.5px; line-height: 1.8; }
  .foot a { color: var(--mut); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="logo">BrAIn</span>
      <input id="q" placeholder="Search passwords" autocomplete="off" spellcheck="false" />
      <span class="cnt" id="cnt"></span>
    </div>
    <div id="list"></div>
    <div class="foot">
      Passwords are AES-256-GCM encrypted on disk; the key lives in your OS credential store.<br>
      Internal page &middot; <a href="#" id="back">&larr; Back to new tab</a>
    </div>
  </div>
<script>
  var items = Array.isArray(window.__brainPwData) ? window.__brainPwData : [];
  var shown = {};      // id -> revealed password (arrives via b:27 after OS auth)
  var pending = {};    // id -> 'show' | 'copy' — what to do when b:27 lands
  var pendingDel = {}; // id -> true while the host-side auth prompt is up
  var pendingBtn = {}; // id -> the copy button to flash when b:27 lands

  function send(cmd) {
    try { window.external && window.external.sendMessage('brain:' + cmd); } catch (e) { }
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function hostOf(o) {
    try { return new URL(o).hostname.replace(/^www\./, ''); } catch (e) { return o; }
  }
  function hue(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return 'hsl(' + (((h % 360) + 360) % 360) + ' 60% 55%)';
  }
  function when(d) {
    if (!d) return '';
    var t = new Date(d * 1000), now = new Date();
    var day = function (x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var diff = Math.round((day(now) - day(t)) / 86400000);
    if (diff <= 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    if (diff < 30) return diff + 'd ago';
    return t.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function dots(p) {
    return '\u2022'.repeat(Math.min(Math.max(p.length, 8), 14));
  }

  var SVG = {
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2.7-4.6 6.2-7 10-7s7.3 2.4 10 7c-2.7 4.6-6.2 7-10 7S4.7 16.6 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeoff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c2.7-4.6 6.2-7 10-7s7.3 2.4 10 7c-2.7 4.6-6.2 7-10 7S4.7 16.6 2 12z"/><circle cx="12" cy="12" r="3"/><line x1="4.5" y1="4" x2="19.5" y2="20"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    chk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4.5"/><path d="M11.5 11.5L20 3M15 8l3 3M18 5l3 3"/></svg>'
  };

  function render() {
    var box = document.getElementById('list');
    var q = document.getElementById('q').value.trim().toLowerCase();
    var html = '', n = 0;
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var host = hostOf(it.o);
      if (q && host.toLowerCase().indexOf(q) < 0 && (it.u || '').toLowerCase().indexOf(q) < 0) continue;
      n++;
      var on = shown[it.id];
      html += '<div class="row' + (pendingDel[it.id] ? ' pd' : '') + '" data-id="' + esc(it.id) + '">' +
        '<span class="ic" style="background:' + hue(host) + '">' + SVG.key + '</span>' +
        '<span class="tt">' + esc(host) + '</span>' +
        '<span class="uu">' + esc(it.u || '(no username)') + '</span>' +
        '<span class="pw' + (on ? ' on' : '') + '">' + esc(on ? shown[it.id] : dots('........')) + '</span>' +
        '<span class="tm">' + esc(when(it.m || it.c)) + '</span>' +
        '<span class="act">' +
          '<button class="ab eye" title="' + (on ? 'Hide' : 'Show') + ' password">' + (on ? SVG.eyeoff : SVG.eye) + '</button>' +
          '<button class="ab cpy" title="Copy password">' + SVG.copy + '</button>' +
          '<button class="ab del" title="Delete">' + SVG.x + '</button>' +
        '</span></div>';
    }
    box.innerHTML = html ||
      '<div class="empty"><b>No saved passwords yet</b><br>Sign in to a site and BrAIn will offer to remember it &mdash; or right-click a password field and insert a generated one.</div>';
    document.getElementById('cnt').textContent = items.length ? items.length + ' saved' : '';
  }

  function copyText(t, btn) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) { }
    ta.remove();
    if (btn) {
      btn.classList.add('ok'); btn.innerHTML = SVG.chk;
      setTimeout(function () { btn.classList.remove('ok'); btn.innerHTML = SVG.copy; }, 900);
    }
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var row = e.target.closest && e.target.closest('.row');
    if (!row) return;
    var id = row.getAttribute('data-id');
    var it = null;
    for (var i = 0; i < items.length; i++) if (items[i].id === id) it = items[i];
    if (!it) return;
    var btn = e.target.closest('.ab');
    if (!btn) { send('newtab:' + it.o); return; }
    // Reveal/copy/delete all go through host-side OS auth. b:27 carries the
    // password for show/copy; a successful delete ends in a fresh b:25.
    if (btn.classList.contains('eye')) {
      if (shown[id]) { delete shown[id]; render(); }
      else { pending[id] = 'show'; send('pwreveal:' + id); }
    } else if (btn.classList.contains('cpy')) {
      if (shown[id]) copyText(shown[id], btn);
      else { pending[id] = 'copy'; pendingBtn[id] = btn; send('pwreveal:' + id); }
    } else if (btn.classList.contains('del')) {
      pendingDel[id] = true; render();
      send('pwdel:' + id); // host pushes b:25 with the authoritative list
    }
  });

  document.getElementById('q').addEventListener('input', render);
  document.getElementById('back').addEventListener('click', function (e) {
    e.preventDefault(); send('navigate:about:newtab');
  });

  // chrome.js relays every host push as a 'brain-msg' event — b:25 is our
  // list, b:27 is the authenticated reveal/copy answer (or deny).
  document.addEventListener('brain-msg', function (e) {
    var j = e.detail;
    if (j && j.b === 25 && Array.isArray(j.items)) {
      items = j.items; pendingDel = {}; render();
    } else if (j && j.b === 27) {
      var act = pending[j.id];
      delete pending[j.id];
      if (j.deny) { pendingBtn[j.id] = null; return; }
      if (act === 'copy') { copyText(j.p || '', pendingBtn[j.id]); pendingBtn[j.id] = null; }
      else { shown[j.id] = j.p; render(); }
    }
  });

  render();
  send('pwget'); // pull the authoritative list on load
</script>
</body>
</html>
