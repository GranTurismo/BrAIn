<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Tab</title>
<script>
  // This doc is served via LoadRawString, so location.href reads about:blank —
  // flag it so the host maps the tab back to about:newtab on refresh/switch.
  window.__brainNewTab = 1;
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; background: #0b0b13; color: #e8e8f0;
    font-family: "Segoe UI Variable Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; position: relative;
  }
  /* ambient gradient orbs */
  /* Pre-softened gradients instead of filter:blur(90px) — the blur made the
     first raster of every new tab ~45ms slower for a near-identical look. */
  .orb { position: fixed; border-radius: 50%; opacity: .5; pointer-events: none; will-change: transform; }
  .orb.a { width: 760px; height: 760px; top: -320px; left: -240px;
    background: radial-gradient(circle closest-side, rgba(74,63,184,.85), rgba(74,63,184,.32) 45%, rgba(74,63,184,0));
    animation: drift1 26s ease-in-out infinite alternate; }
  .orb.b { width: 680px; height: 680px; bottom: -300px; right: -220px;
    background: radial-gradient(circle closest-side, rgba(31,122,104,.85), rgba(31,122,104,.32) 45%, rgba(31,122,104,0));
    animation: drift2 30s ease-in-out infinite alternate; }
  .orb.c { width: 480px; height: 480px; top: calc(40% - 90px); right: calc(22% - 90px);
    background: radial-gradient(circle closest-side, rgba(109,63,160,.85), rgba(109,63,160,.3) 45%, rgba(109,63,160,0)); opacity: .28;
    animation: drift1 34s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(70px,40px) scale(1.12); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1.05); } to { transform: translate(-60px,-50px) scale(.95); } }

  /* Staggered entrance — only on the app's first launch (html.anim). Opening
     or switching tabs re-renders this page and replaying the rise reads as
     flicker, so those loads paint final state instantly. */
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  html.anim .clock, html.anim .date, html.anim .logo, html.anim .tag,
  html.anim form, html.anim #recent, html.anim .hint {
    animation: rise .7s cubic-bezier(.16,1,.3,1) both;
  }
  html.anim .date { animation-delay: .05s; }
  html.anim .logo { animation-delay: .11s; }
  html.anim .tag { animation-delay: .18s; }
  html.anim form { animation-delay: .25s; }
  html.anim #recent { animation-delay: .34s; }
  html.anim .hint { animation-delay: .45s; }

  .clock { font-size: 64px; font-weight: 200; letter-spacing: 1px; color: #f2f2fc;
    font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 4px; }
  .date { font-size: 13px; color: #7a7a96; margin-bottom: 42px; letter-spacing: .3px; }

  .logo {
    font-size: 52px; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px;
    background: linear-gradient(120deg, #9c9cff, #4ec9b0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { color: #8a8aa0; margin-bottom: 38px; font-size: 14px; }
  .tag b { color: #4ec9b0; font-weight: 600; }

  form {
    display: flex; gap: 10px; width: min(640px, 86vw);
    padding: 8px; border-radius: 999px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 12px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
    transition: border-color .2s, box-shadow .2s;
  }
  form:focus-within {
    border-color: rgba(124,124,255,.45);
    box-shadow: 0 12px 40px rgba(0,0,0,.35), 0 0 0 4px rgba(124,124,255,.12), inset 0 1px 0 rgba(255,255,255,.05);
  }
  input {
    flex: 1; padding: 13px 18px; border: none; outline: none;
    background: transparent; color: #eeeefc; font-size: 15px;
  }
  input::placeholder { color: #5e5e78; }
  button {
    padding: 12px 26px; border-radius: 999px; border: none; cursor: pointer;
    background: linear-gradient(120deg, #7c7cff, #6868f0); color: #fff;
    font-size: 14px; font-weight: 600; letter-spacing: .2px;
    transition: filter .15s, transform .1s; box-shadow: 0 4px 16px rgba(124,124,255,.35);
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(.96); }

  #recent { display: none; margin-top: 46px; max-width: 700px; width: min(700px, 88vw); }
  #recent h2 {
    font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase;
    color: #5f5f7c; margin-bottom: 14px; text-align: center;
  }
  #tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile {
    display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
    border-radius: 14px; color: #c5c5dd; font-size: 12.5px; font-weight: 500;
    transition: transform .15s, border-color .15s, background .15s, color .15s;
    overflow: hidden; white-space: nowrap;
  }
  html.anim .tile { animation: rise .4s cubic-bezier(.16,1,.3,1) both; }
  .tile:hover {
    transform: translateY(-2px); background: rgba(255,255,255,.07);
    border-color: rgba(124,124,255,.4); color: #f0f0fc;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
  .tile .ic {
    width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid;
    place-items: center; font-size: 12px; font-weight: 700; color: #fff;
    position: relative; box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
  }
  .tile .ic img { position: absolute; inset: 4px; width: 18px; height: 18px; border-radius: 5px; }
  .tile > span:last-child { overflow: hidden; text-overflow: ellipsis; }

  .hint { position: fixed; bottom: 26px; color: #4c4c62; font-size: 12.5px;
    max-width: 620px; text-align: center; line-height: 1.7; padding: 0 20px; }
  .hint code { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
    border-radius: 6px; padding: 1px 7px; color: #9a9ab8; }
  .help {
    display: inline-block; margin-top: 8px; padding: 6px 16px; cursor: pointer;
    border-radius: 999px; border: 1px solid rgba(255,255,255,.09);
    background: rgba(255,255,255,.05); color: #8f8fb0; font-size: 12px; font-weight: 600;
    transition: background .15s, color .15s, border-color .15s;
  }
  .help:hover { background: rgba(124,124,255,.12); border-color: rgba(124,124,255,.35); color: #c9c9ff; }
</style>
</head>
<body>
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>

  <div class="clock" id="clock"></div>
  <div class="date" id="date"></div>
  <div class="logo">BrAIn</div>
  <div class="tag">A browser your <b>AI</b> can drive &mdash; MCP server built in</div>
  <form id="f">
    <input id="q" autofocus placeholder="Search Google or type a URL" autocomplete="off" />
    <button type="submit">Go</button>
  </form>
  <div id="recent"><h2>Recent</h2><div id="tiles"></div></div>
  <div class="hint">
    Connect an MCP client to this process over <code>stdio</code> and the agent
    can navigate, click, type, snapshot and screenshot this browser.<br/>
    <span class="help" id="help">How to use &rarr;</span>
  </div>
<script>
  function send(cmd) {
    try { window.external && window.external.sendMessage('brain:' + cmd); } catch (e) { }
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (v) send('navigate:' + v);
  });
  document.getElementById('help').addEventListener('click', function () {
    send('navigate:about:help');
  });

  function tick() {
    var d = new Date();
    var hh = d.getHours(), mm = d.getMinutes();
    document.getElementById('clock').textContent =
      (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
    document.getElementById('date').textContent =
      d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }
  tick(); setInterval(tick, 10000);

  function hostOf(u) {
    try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; }
  }
  function hue(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return 'hsl(' + (((h % 360) + 360) % 360) + ' 60% 50%)';
  }
  function renderTiles(hist) {
    var box = document.getElementById('recent');
    var tiles = document.getElementById('tiles');
    if (!hist || !hist.length) { box.style.display = 'none'; return; }
    // one tile per site, single row (matches the in-chrome overlay)
    var picks = [], seen = {};
    for (var k = 0; k < hist.length && picks.length < 4; k++) {
      var hu = typeof hist[k] === 'string' ? hist[k] : hist[k].u, hh = hostOf(hu);
      if (hh && !seen[hh]) { seen[hh] = 1; picks.push(hist[k]); }
    }
    var html = '';
    for (var i = 0; i < picks.length; i++) {
      var it = picks[i];
      var u = typeof it === 'string' ? it : it.u;
      var icon = typeof it === 'object' ? it.i : null;
      var h = hostOf(u);
      html += '<div class="tile" style="animation-delay:' + (i * 45) + 'ms" data-u="' + u.replace(/"/g, '&quot;') + '" title="' + u.replace(/"/g, '&quot;') + '">' +
        '<span class="ic" style="background:' + hue(h) + '">' +
        (h.charAt(0) || '?').toUpperCase() +
        (icon ? '<img src="' + icon.replace(/"/g, '&quot;') + '" alt="" onerror="this.remove()">' : '') +
        '</span><span>' + h + '</span></div>';
    }
    tiles.innerHTML = html;
    box.style.display = '';
    tiles.querySelectorAll('.tile').forEach(function (el) {
      el.addEventListener('click', function () { send('navigate:' + el.getAttribute('data-u')); });
    });
  }
  // chrome.js mirrors the host's state push to window.__brainState and fires
  // a 'brain-state' DOM event; use both so tiles render regardless of timing.
  document.addEventListener('brain-state', function (e) {
    renderTiles(e.detail && e.detail.hist);
  });
  if (window.__brainState) renderTiles(window.__brainState.hist);
  setTimeout(function () { if (window.__brainState) renderTiles(window.__brainState.hist); }, 900);

  // autofocus alone is flaky when the doc is injected via NavigateToString —
  // focus the search box so typing starts immediately. Next frame, not
  // mid-parse: a sync focus() forced a ~26ms layout before first paint.
  requestAnimationFrame(function () {
    try { document.getElementById('q').focus({ preventScroll: true }); } catch (e) { }
  });
  window.addEventListener('load', function () {
    try { document.getElementById('q').focus(); } catch (e) { }
  });
</script>
</body>
</html>
